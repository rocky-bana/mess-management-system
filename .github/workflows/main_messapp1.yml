name: Deploy App

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./app
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Create .env file
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          echo "$APP_ENV" > .env

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Remove node_modules to reduce package size
        run: rm -rf node_modules

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03DB9D1DE1BC40969EA2D9E4574E2939 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FEF0779F545242528F0D24D1778FAF46 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E27EB25486D4600BF95079115F689F6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'messapp1'
          slot-name: 'Production'
          package: ./app/dist
          clean: true
          startup-command: 'pm2 serve /home/site/wwwroot 8080 --spa --no-daemon'